[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cognac"
version = "1.0.0"
description = "COGNAC: machine-learned atomic interactions in the mod. UNIFAC framework (activity coefficients from SMILES)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "rdkit>=2023.9", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
authors = [
  { name = "Marco Hoffmann" }, { name = "Sebastian Schmitt" }, { name = "Hans Hasse" }, { name = "Fabian Jirasek" },
]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Chemistry"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/marco-hoffmann/COGNAC"

[tool.setuptools.packages.find]
include = ["cognac*"]

[tool.setuptools.package-data]
cognac = ["checkpoints/*/*.pt", "checkpoints/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
